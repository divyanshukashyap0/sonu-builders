<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Sonu Builders</title>
  <meta name="theme-color" content="#DD9726">
  <style>
    :root {
      --brand-dark: #000C21;
      --brand-blue: #003368;
      --brand-gold: #DD9726;
      --brand-light: #f8fafc;
    }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--brand-blue), var(--brand-dark));
      color: #fff;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    .card {
      width: min(560px, calc(100% - 2rem));
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(221,151,38,0.35);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
    }
    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 700;
      margin: 0 0 8px;
    }
    p {
      margin: 0 0 16px;
      color: #e5e7eb;
    }
    .btn {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      background: linear-gradient(135deg, rgba(221,151,38,0.9), rgba(221,151,38,0.7));
      box-shadow: 0 6px 14px rgba(221,151,38,0.35);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(221,151,38,0.45);
    }
    .muted {
      font-size: 13px;
      color: #cbd5e1;
    }
  </style>
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
  <div class="card" role="alert" aria-live="polite">
    <h1>You’re Offline</h1>
    <p>It looks like your device is not connected to the internet.</p>
    <p>You can still browse cached pages. When you’re back online, the latest content will be synced automatically.</p>
    <a class="btn" href="/">Go to Home</a>
    <p class="muted" style="margin-top:12px">Sonu Enterprises & Building Developers</p>
  </div>
</body>
</html>
